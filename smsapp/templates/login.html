{% extends 'base.html' %}
{% load static %}

{% block title %}
Log In For Admin/Student/Teacher
{% endblock %}

{% block body %}
<div class="row my-5">
    <div class="col-md-4 mx-auto">
        <div class="card p-4 border-0">
            <form method="post" action="{% url 'logcode' %}">
                {% csrf_token %}
                <div class="text-center" style="color: blue;">
                    <span><i class="fa-solid fa-user-large fa-5x"></i></span>
                </div>
                <h2 class="text-center fw-normal py-2">Welcome User</h2>
                {% if msg %}
                <div class="alert alert-danger" role="alert">{{ msg }}</div>
                {% endif %}
                <div class="form-floating my-2">
                    <select name="usertype" id="utype" class="form-select" required>
                        <option>--Select Usertype--</option>
                        <option value="admin">Admin</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                    <label for="utype">Select Usertype</label>
                </div>
                <div class="form-floating my-2">
                    <input type="text" name="userid" class="form-control" id="n" placeholder="Enter Userid" />
                    <label for="n">Enter Userid</label>
                </div>
                <div class="form-floating my-2">
                    <input type="password" name="password" class="form-control" id="pass"
                        placeholder="Enter password" />
                    <label for="pass">Enter password</label>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary w-100">login</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
