{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
 
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Edit Details About Subject</h1>
        <form method="post">
            {% csrf_token %}
            <table class="table">
                <tr>
                    <td>Subject Name</td>
                    <td>
                        <input type="text" name="subject_name" value="{{sl.subject_name}}" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Subject Class</td>
                    <td>
                        <input type="text" name="sclass" value="{{sl.sclass}}" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Name of Book or Publication</td>
                    <td>
                        <input type="text" name="book" value="{{sl.book}}" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Subject Teacher</td>
                    <td>
                        <input type="text" name="steacher" value="{{sl.steacher}}" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <button type="submit" class="btn btn-success">Save</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</div>

{% endblock %}
