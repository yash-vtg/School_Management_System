{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="row"> 
    <div class="col-sm-12">
        <h1 class="text-center">Add Subjects</h1>
        <form method="post">
            {% csrf_token %}
            <table class="table">
                <tr>
                    <td>Enter Subject Name</td>
                    <td><input type="text" name="subject_name" class="form-control"></td>
                </tr>
                <tr>
                    <td>Select Your Class</td>
                    <td>
                        <select name="sclass" class="form-select">
                            <option value="">--Select Class--</option>
                            {% for c in cl %}
                            <option value="{{c.class_name}}">{{c.class_name}}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Enter Book Name or Publication</td>
                    <td><input type="text" name="book" class="form-control"></td>
                </tr>
                <tr>
                    <td>Enter Subject Teacher</td>
                    <td><input type="text" name="steacher" class="form-control"></td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <button type="submit" class="btn btn-success">
                            <h5>Add a subject</h5>
                        </button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</div>

{% endblock %}
