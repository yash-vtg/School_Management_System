{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">
            Add Notification
        </h1>
        <form method="post">
            {% csrf_token %}
            <table class="table">
                <tr>
                    <td>Enter Notification</td>
                    <td>
                        <textarea required name="text" class="form-control"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Upload File</td>
                    <td>
                        <input required type="file" name="doc" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <button class="btn btn-success" type="submit">Add Notification</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</div>
{% endblock %}
