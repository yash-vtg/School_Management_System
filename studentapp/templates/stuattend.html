{% extends 'studentbase.html' %}
{% load static %}
{% block student %}

<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">View Your Attendence</h1>
        <table class="table">
            <tr>
                <th>S. No.</th>
                <th>Roll Number</th>
                <th>Name</th>
                <th>Class</th>
                <th>Attendence</th>
                <th>Date</th>
            </tr>
            {% for s in att %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{s.rollno}}</td>
                <td>{{s.name}}</td>
                <td>{{s.sclass}}</td>
                <td>{{s.status}}</td>
                <td>{{s.created_date}}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

{% endblock %}
