{% extends 'teacherbase.html' %}
{% load static %}
{% block teacher %}

<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Teacher Profile</h1>
        <form action="{% url 'teacherapp:uploadpic' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-sm-2 mx-auto">
                    {% if teacher.pic %}
                    <img src="{{teacher.pic.url}}" alt="Error" class="img-fluid border-2" height="200px" width="150px">
                    {% endif %}
                    <input type="file" name="pic" value="{{teacher.pic.url}}">
                    <input type="submit" value="upload" class="btn btn-success mt-2">
                </div>
            </div>
        </form>
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-sm-6">
                    <label for="n" class="form-label">Name</label>
                    <input type="text" name="name" value="{{teacher.name}}" id="n" class="form-control rounded-0">
                </div>
                <div class="col-sm-6">
                    <label for="fn" class="form-label">Father Name</label>
                    <input type="text" name="fname" value="{{teacher.fname}}" id="fn" class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="mn" class="form-label">Mother Name</label>
                    <input type="text" name="mname" value="{{teacher.mname}}" id="mn" class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="gn" class="form-label">Gender</label>
                    <input type="text" name="gender" value="{{teacher.gender}}" id="gn" class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="bn" class="form-label">Date of Birth</label>
                    <input type="date" name="dob" value="{{teacher.dob}}" id="bn" class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="nn" class="form-label">Contact Number</label>
                    <input type="number" name="contactno" value="{{teacher.contactno}}" id="nn"
                        class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="en" class="form-label">E-mail Address</label>
                    <input type="email" name="emailaddress" value="{{teacher.emailaddress}}" id="en"
                        class="form-control rounded-0" readonly>
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="nh" class="form-label">Class of Teacher</label>
                    <input type="text" name="tclass" value="{{teacher.tclass}}" id="nh" class="form-control rounded-0"
                        readonly>
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="na" class="form-label">Address</label>
                    <input type="text" name="address" value="{{teacher.address}}" id="na"
                        class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="ns" class="form-label">Salary</label>
                    <input type="text" name="salary" value="{{teacher.salary}}" id="ns" class="form-control rounded-0"
                        readonly>
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="qn" class="form-label">Qualification</label>
                    <input type="text" name="qualification" value="{{teacher.qualification}}" id="qn"
                        class="form-control rounded-0">
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="pn" class="form-label">password</label>
                    <input type="number" name="password" value="{{teacher.password}}" id="pn"
                        class="form-control rounded-0" readonly>
                </div>
                <div class="col-sm-6 mt-3">
                    <label for="dn" class="form-label">Creation Date</label>
                    <input type="text" name="created_date" value="{{teacher.created_date}}" id="dn"
                        class="form-control rounded-0" readonly>
                </div>
            </div>
        </form>
        <div class="row mt-3">
            <div class="col-sm-1 mx-auto">
                <a href="#"><button class="btn btn-success">Update</button></a>
            </div>
        </div>
        </form>
    </div>
</div>

{% endblock %}
