{% extends 'teacherbase.html' %}
{% load static %}
{% block teacher %}

<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Add Self Learning Material</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <table class="table mx-auto w-75 mt-4 table-bordered">
                <tr>
                    <td>Enter Title</td>
                    <td><input required type="text" name="title" class="form-control"></td>
                </tr>
                <tr>
                    <td>Upload Files</td>
                    <td><input required type="file" name="sm" class="form-control"></td>
                </tr>
                <tr>
                    <td>Select Class For Learning Material</td>
                    <td>
                        <select name="tclass" class="form-select">
                            <option value="">--Select Class--</option>
                            {% for c in cl %}
                            <option value="{{ c.class_name }}">{{ c.class_name }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-danger">*Use your class to add here.</small>
                    </td>
                </tr>
                <tr>
                    <td class="text-center" colspan="2">
                        <button type="submit" class="btn btn-success">Upload</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</div>

{% endblock %}
